services:
  database-accessor-api:
    container_name: database-accessor-api
    build:
      context: ./database-accessor-api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./database-accessor-api:/app
    depends_on:
      timescaledb:
        condition: service_healthy
    env_file:
      - .env
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  indicator-api:
    container_name: indicator-api
    build:
      context: ./indicator-api
      dockerfile: Dockerfile
    ports:
      - "8010:8010"
    volumes:
      - ./indicator-api:/app
    depends_on:
      database-accessor-api:
        condition: service_healthy
    env_file:
      - .env
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  timescaledb:
    container_name: timescaledb
    image: timescale/timescaledb:latest-pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - 5432:5432
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./timescaledb-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  broker-service:
    container_name: broker-service
    build:
      context: ./broker-service
      dockerfile: Dockerfile
    ports:
      - "8050:8050"
    volumes:
      - ./broker-service:/app
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8050/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  ingestion-service:
    container_name: ingestion-service
    build:
      context: ./ingestion-service
      dockerfile: Dockerfile
    volumes:
      - ./ingestion-service:/app
    depends_on:
      database-accessor-api:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      broker-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    restart: always

  webserver:
    container_name: webserver
    build:
      context: ./webserver
      dockerfile: Dockerfile
    ports:
      - 8765:8765
      - 8080:8080
    volumes:
      - ./webserver:/app
    depends_on:
      redis:
        condition: service_healthy
      broker-service:
        condition: service_healthy
    env_file:
      - ./webserver/.env
    environment:
      - MODE=${MODE}
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - 5173:5173
    volumes:
      - frontend_data:/app/dist
      - ./frontend:/app/frontend
    depends_on:
      webserver:
        condition: service_healthy
    environment:
      - MODE=${MODE}

  redis:
    container_name: redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  timescaledb_data:
  frontend_data:
  redis_data:

