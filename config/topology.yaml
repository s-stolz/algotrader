mode: development

public:
  host: localhost

services:
  database_accessor_api:
    network:
      host: database-accessor-api
      port: 8000
      published_port: 8000
    logging:
      level: INFO
      format: pretty
    resources:
      cpus: 0.5
      memory_reservation_mb: 256

  indicator_api:
    network:
      host: indicator-api
      port: 8010
      published_port: 8010
    logging:
      level: INFO
      format: pretty
    resources:
      cpus: 1.0
      memory_reservation_mb: 512

  backtester:
    logging:
      level: INFO
      format: pretty
    api:
      network:
        host: backtester-api
        port: 8020
        published_port: 8020
      resources:
        cpus: 0.5
        memory_reservation_mb: 256
    worker:
      resources:
        cpus: 1.0
        memory_reservation_mb: 1024
      poll_interval_seconds: 1.0
      heartbeat:
        interval_seconds: 5.0
        stale_after_seconds: 30.0
    sweeps:
      max_candidate_count: 1000

  broker_service:
    network:
      host: broker-service
      port: 8050
      published_port: 8050
    logging:
      level: INFO
      format: pretty
    resources:
      cpus: 0.5
      memory_reservation_mb: 256
    streams:
      redis_db: 0
      ticks:
        queue_size: 1000
        max_length: null
      candles:
        max_length: null
      limits:
        max_symbol_streams: 20
        max_trendbar_streams: 10
    ctrader:
      request_timeout_seconds: 20.0

  ingestion_service:
    logging:
      level: INFO
      format: pretty
    resources:
      cpus: 0.5
      memory_reservation_mb: 256
    consumer:
      batch_size: 100
      block_ms: 5000

  webserver:
    network:
      host: webserver
      websocket:
        port: 8765
        published_port: 8765
      health:
        port: 8080
        published_port: 8080
    logging:
      level: INFO
      format: pretty
    resources:
      cpus: 0.25
      memory_reservation_mb: 128
    consumer:
      block_ms: 5000
      batch_size: 100
    streams:
      queue_size: 1000
      max_length: 10000

  frontend:
    network:
      host: frontend
      port: 5173
      published_port: 5173
    resources:
      cpus: 1.0
      memory_reservation_mb: 512

infrastructure:
  redis:
    network:
      host: redis
      port: 6379
      published_port: 6379
    resources:
      cpus: 0.25
      memory_reservation_mb: 256
    database: 0

  timescaledb:
    network:
      host: timescaledb
      port: 5432
      published_port: 5432
    resources:
      cpus: 1.0
      memory_reservation_mb: 512
    database:
      user: postgres
      name: finance_data
      echo: false
