[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "broker-service"
version = "0.0.1"
description = "FastAPI broker microservice for cTrader Open API"
authors = [{ name = "Sebastian Stolz" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.128.0",
  "uvicorn[standard]>=0.40.0",
  "pydantic-settings>=2.12.0",
  "redis>=7.1.0",
  "ctrader-open-api>=0.9.2",
  "service_identity>=24.2.0",
]

[project.optional-dependencies]
dev = []

[project.scripts]
broker-service = "app.main:run"
