[project]
name = "webserver"
version = "1.0.0"
description = "WebSocket server for real-time market data streaming"
requires-python = ">=3.11"
dependencies = [
    "websockets>=16.0",
    "redis>=7.1.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.1"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
