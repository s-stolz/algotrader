[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "backtester"
version = "0.0.0"
description = "Backtesting module for algotrader"
authors = [{ name = "Sebastian Stolz", email = "admin@tradingnerd.io" }]
license = { text = "MIT" }
readme = "CONTEXT.md"
requires-python = ">=3.12,<3.16"
dependencies = [
    "db-accessor-client",
    "indicator-engine",
    "fastapi>=0.128.0",
    "pandas>=2.1.0",
    "numpy>=1.24.0",
    "pydantic>=2.12.0",
    "uvicorn[standard]>=0.40.0",
    "redis>=7.1.0",
]

[project.urls]
Homepage = "https://github.com/s-stolz/algotrader"
Repository = "https://github.com/s-stolz/algotrader"

[project.optional-dependencies]
dev = [
  "ruff>=0.14.11",
  "black>=24.4.2",
]

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["strategies.custom*"]
