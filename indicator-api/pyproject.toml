[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "indicator-api"
version = "0.0.0"
description = "Indicator API for algotrader"
authors = [{ name = "Sebastian Stolz", email = "admin@tradingnerd.io" }]
license = { text = "MIT" }
readme = "CONTEXT.md"
requires-python = ">=3.12,<3.16"
dependencies = [
    "algotrader-logger",
    "db-accessor-client",
    "indicator-engine",
    "fastapi>=0.116.1",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "pandas>=2.3.2",
    "numpy>=2.2.6",
    "httpx>=0.28.1",
    "redis>=7.1.0",
]

[project.urls]
Homepage = "https://github.com/s-stolz/algotrader"
Repository = "https://github.com/s-stolz/algotrader"

[project.optional-dependencies]
dev = [
    "ruff>=0.14.11",
    "black>=24.4.2",
]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
