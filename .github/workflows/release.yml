name: Versioned release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Require a version tag on main
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          python3 -m release.build_bundle validate-tag "$RELEASE_TAG"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'This release already exists. Published releases are immutable.' >&2
            exit 1
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: '3.15.2'
      - uses: actions/setup-node@v5
        with:
          node-version: '26.13.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install development test dependencies
        run: |
          PYTHON=python3 ./scripts/setup_venvs.sh all
          npm --prefix frontend ci
      - name: Verify source and installer contracts
        env:
          VITEST_MAX_WORKERS: '2'
        run: |
          make verify
          make test-release
          .venv/bin/python -m unittest discover -s scripts/tests -t . -p 'test_*.py'

  launchers:
    needs: verify
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Parse native PowerShell launcher
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'release/algotrader.ps1'), [ref]$tokens, [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
      - name: Parse shell launcher
        if: runner.os != 'Windows'
        run: bash -n release/algotrader.sh

  images:
    needs: [verify, launchers]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: database-accessor-api
            file: database-accessor-api/Dockerfile
          - name: backtester
            file: backtester/Dockerfile
          - name: indicator-api
            file: indicator-api/Dockerfile
          - name: timescaledb
            file: timescaledb-init/Dockerfile
          - name: broker-service
            file: broker-service/Dockerfile
          - name: ingestion-service
            file: ingestion-service/Dockerfile
          - name: realtime-service
            file: realtime-service/Dockerfile
          - name: frontend
            file: release/frontend.Dockerfile
          - name: installer
            file: release/installer.Dockerfile
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          COMPONENT: ${{ matrix.name }}
        run: echo "name=ghcr.io/${REPOSITORY,,}/$COMPONENT" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Record immutable image
        env:
          COMPONENT: ${{ matrix.name }}
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          python3 -c 'import json,os,pathlib; pathlib.Path("digests/"+os.environ["COMPONENT"]+".json").write_text(json.dumps({"name":os.environ["COMPONENT"],"image":os.environ["IMAGE"]}))'
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.name }}
          path: digests/*.json
          retention-days: 7

  bundle:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: actions/download-artifact@v5
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - name: Pin upstream Redis and assemble bundle
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          digest=$(docker buildx imagetools inspect redis:8.10.3-alpine --format '{{json .Manifest.Digest}}' | tr -d '"')
          REDIS_IMAGE="redis@${digest}" python3 -c 'import json,os,pathlib; pathlib.Path("digests/redis.json").write_text(json.dumps({"name":"redis","image":os.environ["REDIS_IMAGE"]}))'
          python3 -m release.build_bundle assemble "$RELEASE_TAG" --digests digests --output output
          python3 -m release.build_bundle verify-public output/release.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: output/*
          retention-days: 7

  smoke:
    needs: bundle
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: release-bundle
          path: output
      - name: Verify anonymous images and disposable storage
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          python3 -m pip install pyyaml
          python3 -m release.smoke output/release.json --platform "$PLATFORM"

  publish:
    needs: [bundle, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: release-bundle
          path: output
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          args=(--verify-tag --generate-notes)
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" output/*.zip output/*.sha256 "${args[@]}"
