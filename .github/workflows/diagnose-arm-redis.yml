name: Validate immutable v0.0.1 on native ARM
on:
  push:
    branches: [codex/v001-arm-diagnostic]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native-smoke:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v0.0.1
      - uses: actions/download-artifact@v5
        with:
          name: release-bundle
          run-id: 43748864273
          github-token: ${{ github.token }}
          path: output
      - name: Verify original bundle checksum and embedded manifest
        run: |
          cd output
          sha256sum -c algotrader-v0.0.1.zip.sha256
          unzip -p algotrader-v0.0.1.zip release.json | cmp release.json -
          unzip algotrader-v0.0.1.zip -d extracted
          cd extracted
          sha256sum -c SHA256SUMS
      - name: Run unchanged release gate on native ARM
        run: |
          test "$(uname -m)" = aarch64
          python3 -m pip install pyyaml
          python3 -m release.smoke output/release.json --platform linux/arm64
