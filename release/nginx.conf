map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    client_max_body_size 100m;

    location = /health {
        access_log off;
        return 200 'ok';
    }
    location /api/data-accessor/ {
        proxy_pass http://database-accessor-api:8000/;
    }
    location /api/backtester/ {
        proxy_pass http://backtester-api:8020/;
    }
    location /api/indicator-api/ {
        proxy_pass http://indicator-api:8010/;
    }
    location /api/broker/ {
        proxy_pass http://broker-service:8050/;
    }
    location /api/ingestion/ {
        proxy_pass http://ingestion-service:8000/;
    }
    location /ws {
        proxy_pass http://realtime-service:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
